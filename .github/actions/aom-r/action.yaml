name: AOM R setup
description: Configure R and the package repository for AOM module checks and documentation.
inputs:
  r-version:
    description: R version selected by the product workflow.
    default: release
  http-user-agent:
    description: HTTP user agent selected by the product workflow.
    default: default
  system-packages:
    description: Ubuntu build libraries required by the product and documentation dependencies.
    default: ''
runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        http-user-agent: ${{ inputs.http-user-agent }}
        use-public-rspm: false
        cran: https://cloud.r-project.org
    - name: Install declared Ubuntu build libraries
      if: runner.os == 'Linux' && inputs.system-packages != ''
      shell: bash
      env:
        AOM_SYSTEM_PACKAGES: ${{ inputs.system-packages }}
      run: |
        read -r -a packages <<< "$AOM_SYSTEM_PACKAGES"
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends "${packages[@]}"
